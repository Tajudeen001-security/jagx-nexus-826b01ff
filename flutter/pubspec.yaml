publish_to: "none"
version: 1.4.0+5
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_markdown: ^0.7.4+1
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  share_plus: ^10.1.3
  pdf: ^3.11.1
  printing: ^5.13.4
  file_picker: ^8.1.7
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^6.2.2
  archive: ^4.0.9
