name: Build JagX AI Android

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Java versions
        run: |
          flutter --version
          java -version

      - name: Configure Flutter SDK path
        run: |
          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_SDK="$(dirname "$(dirname "$FLUTTER_BIN")")"
          printf 'flutter.sdk=%s\n' "$FLUTTER_SDK" > android/local.properties
          echo "Flutter SDK: $FLUTTER_SDK"

      - name: Ensure Android SDK 36 is installed
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Ensure Gradle wrapper
        run: |
          if [ ! -x android/gradlew ]; then
            mkdir -p "$RUNNER_TEMP/gradle"
            curl -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$RUNNER_TEMP/gradle/gradle.zip"
            unzip -q "$RUNNER_TEMP/gradle/gradle.zip" -d "$RUNNER_TEMP/gradle"
            "$RUNNER_TEMP/gradle/gradle-8.14.3/bin/gradle" -p android wrapper --gradle-version 8.14.3
            chmod +x android/gradlew
          fi
          test -x android/gradlew
          android/gradlew --version

      - name: Generate launcher icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          convert -background none assets/icon.svg -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -background none assets/icon.svg -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -background none assets/icon.svg -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -background none assets/icon.svg -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -background none assets/icon.svg -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            --dart-define=NVIDIA_API_KEY="$NVIDIA_API_KEY"

      - name: Verify APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jagx-ai-release-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
